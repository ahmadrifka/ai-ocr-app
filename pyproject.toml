[project]
name = "ai-ocr-app"
version = "0.1.0"
description = "AI OCR service: read images with LLM, classify, store results"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
