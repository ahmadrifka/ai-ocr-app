<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eff3f2" />
    <title>Sign in — Receipt Desk</title>
    <link rel="stylesheet" href="dashboard.css?v=auth" />
    <script src="login.js?v=auth" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/dashboard/" aria-label="Receipt Desk home">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Receipt Desk</span>
      </a>
    </header>

    <main class="login-shell">
      <form class="login-card" id="login-form" novalidate>
        <p class="eyebrow">Receipt Desk</p>
        <h1>Sign in</h1>
        <p class="intro-copy">Enter the team password to open the OCR dashboard.</p>
        <label class="login-label" for="login-password">Password</label>
        <input
          class="login-input"
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="button button-primary login-submit" id="login-submit" type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
